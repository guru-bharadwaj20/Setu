name: Bug report
description: Something in the app, relay or map does not work as described.
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [Android app, Relay, Rescuer map, Simulator, Protocol]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Setu on two phones
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Setu version
      placeholder: v0.1.0
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: Redmi Note 12, Android 14
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`adb logcat -s Setu` output, relay logs or browser console. Remove locations and codes first."
      render: text
