version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-and-build:
        patterns: ["org.jetbrains.kotlin*", "com.android.*", "com.google.devtools.ksp*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /relay
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development

  - package-ecosystem: npm
    directory: /map
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
